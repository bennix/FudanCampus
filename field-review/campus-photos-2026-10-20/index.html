async function load(key){const id=++token;current=key;const c=configs[key],base=`../${key}-photo-v1/${key}`;status.textContent='正在载入模型…';document.querySelector('#name').textContent=c.name;document.querySelector('#description').textContent=c.description;document.querySelector('#blend').href=base+'.blend';document.querySelector('#glb').href=base+'.glb';document.querySelector('#photos').replaceChildren(...c.photos.map(n=>{const a=document.createElement('a');a.href=`../../references/${key}/photo-${String(n).padStart(2,'0')}.jpg`;a.target='_blank';const im=document.createElement('img');im.src=a.href;im.alt=`${c.name}实景参考 ${n}`;a.append(im);return a}));document.querySelectorAll('[data-model]').forEach(b=>b.classList.toggle('active',b.dataset.model===key));
